name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            binary: sntp-server
          - os: windows-latest
            name: windows
            binary: sntp-server.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sntp-server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sntp-server

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: sntp-server-${{ matrix.name }}
          path: sntp-server/target/release/${{ matrix.binary }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(date -u +'%Y-%m-%d_%H-%M-%S')
          # upload-artifact pierde el bit de ejecución, se restaura dentro del tar.gz
          chmod +x artifacts/sntp-server-linux/sntp-server
          tar -czf sntp-server-linux-x86_64.tar.gz -C artifacts/sntp-server-linux sntp-server
          mv artifacts/sntp-server-windows/sntp-server.exe sntp-server-windows-x86_64.exe
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $TAG (UTC)" \
            --notes "Build automático del commit $GITHUB_SHA" \
            sntp-server-linux-x86_64.tar.gz sntp-server-windows-x86_64.exe
